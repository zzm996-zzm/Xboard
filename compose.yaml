# Canonical Docker Compose file for this fork.
# Keep deployment boring: every server uses this file, scripts only set .env.
services:
  xboard:
    image: ${XBOARD_IMAGE:-ghcr.io/cedar2025/xboard:latest}
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
    environment:
      - RESOURCE_PROFILE=balanced
      - ENABLE_HORIZON=true
      - docker=true
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: xboard123
      MYSQL_DATABASE: xboard
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --stop-writes-on-bgsave-error no

volumes:
  mysql-data:
